<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Splitter</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e2e5ea; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161a; --card:#1d2026; --text:#e8eaed; --muted:#9aa1ab; --line:#2e333b; --accent:#5b8def; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    main { max-width:720px; margin:0 auto; padding:20px 16px 60px; }
    h1 { margin:0 0 16px; font-size:1.5rem; }
    h2 { font-size:1.05rem; margin:0 0 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
    label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:4px; }
    input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
    button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .hidden { display:none !important; }
    .table-wrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:.92rem; }
    th, td { padding:6px; border-bottom:1px solid var(--line); text-align:left; }
    td input.num { width:80px; }
    td.c, th.c { text-align:center; }
    td input[type=checkbox] { width:auto; }
    button.x { background:transparent; color:var(--muted); padding:2px 8px; }
    .status { margin-top:10px; font-size:.92rem; color:var(--muted); }
    .status.err { color:#dc2626; }
    .note { color:var(--muted); font-size:.9rem; margin-top:8px; }
    #camBox { margin-top:12px; }
    #video { width:100%; max-height:70vh; background:#000; border-radius:10px; object-fit:cover; }
    #shot { max-width:100%; max-height:220px; border-radius:8px; border:1px solid var(--line); margin-top:12px; }
  </style>
</head>

<body>
  <main>
    <h1>Receipt Splitter</h1>

    <div class="card">
      <h2>Setup</h2>
      <div class="grid">
        <div>
          <label for="task">Task</label>
          <select id="task">
            <option value="split">Split bill</option>
            <option value="expense">Extract expense</option>
          </select>
        </div>
        <div class="split-only">
          <label for="names">Names (comma separated)</label>
          <input id="names" value="Me, Rahul, Aman">
        </div>
        <div class="split-only">
          <label for="payer">Who paid?</label>
          <select id="payer"></select>
        </div>
        <div class="split-only">
          <label for="method">Split method</label>
          <select id="method">
            <option value="itemwise">By item</option>
            <option value="equal">Equal split</option>
          </select>
        </div>
        <div class="split-only">
          <label for="tip">Tip %</label>
          <input id="tip" type="number" min="0" max="30" step="1" value="0">
        </div>
        <div class="split-only">
          <label for="upi">UPI ID (optional)</label>
          <input id="upi" placeholder="name@upi">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Scan receipt</h2>
      <div class="actions" style="margin-top:0">
        <button id="scan">Scan with camera</button>
      </div>
      <!-- fallback: opens the phone camera directly (no gallery upload) -->
      <input id="fallback" type="file" accept="image/*" capture="environment" class="hidden">

      <div id="camBox" class="hidden">
        <video id="video" autoplay playsinline muted></video>
        <div class="actions">
          <button id="snap">Capture</button>
          <button class="secondary" id="closeCam">Cancel</button>
        </div>
      </div>

      <img id="shot" class="hidden" alt="Scanned receipt">
      <div id="status" class="status"></div>
    </div>

    <div id="review" class="card hidden">
      <h2>Review items</h2>
      <div class="grid">
        <div><label for="merchant">Merchant</label><input id="merchant"></div>
        <div><label for="date">Date</label><input id="date"></div>
        <div><label for="category">Category</label><input id="category"></div>
        <div><label for="total">Receipt total</label><input id="total" type="number" step="any"></div>
      </div>
      <div id="notes" class="note"></div>
      <div class="table-wrap" style="margin-top:12px"><table id="items"></table></div>
      <div class="split-only note">Tick who shared each item. If nobody is ticked, the item is split among everyone.</div>
      <div class="actions">
        <button class="secondary" id="addRow">+ Add item</button>
        <button id="calc">Calculate</button>
      </div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let data = null;
    let rows = [];
    let stream = null;

    const people = () => [...new Set($('names').value.split(',').map(s => s.trim()).filter(Boolean))];
    const isSplit = () => $('task').value === 'split';
    const isItemwise = () => isSplit() && $('method').value === 'itemwise';

    function setStatus(msg, err) { $('status').textContent = msg; $('status').className = 'status' + (err ? ' err' : ''); }

    /* ---------- setup ---------- */
    function refreshPayer() {
      const cur = $('payer').value, ps = people();
      $('payer').innerHTML = ps.map(p => `<option>${esc(p)}</option>`).join('');
      if (ps.includes(cur)) $('payer').value = cur;
    }
    function refreshTaskUI() {
      document.querySelectorAll('.split-only').forEach(el => el.classList.toggle('hidden', !isSplit()));
      if (data) renderTable();
    }
    $('task').onchange = refreshTaskUI;
    $('method').onchange = () => { if (data) renderTable(); };
    $('names').oninput = () => { refreshPayer(); if (data) renderTable(); };

    /* ---------- camera scan ---------- */
    function stopCam() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      $('video').srcObject = null;
      $('camBox').classList.add('hidden');
    }

    $('scan').onclick = async () => {
      setStatus('');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        $('fallback').click();   // camera API unavailable (e.g. not HTTPS) -> native camera
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        $('video').srcObject = stream;
        $('camBox').classList.remove('hidden');
      } catch (e) {
        $('fallback').click();   // permission denied or no camera -> native camera capture
      }
    };

    $('closeCam').onclick = stopCam;

    $('snap').onclick = () => {
      const v = $('video');
      if (!v.videoWidth) return;
      const scale = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth * scale);
      c.height = Math.round(v.videoHeight * scale);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      stopCam();
      c.toBlob(b => processBlob(b), 'image/jpeg', 0.85);
    };

    $('fallback').onchange = () => {
      const f = $('fallback').files[0];
      $('fallback').value = '';
      if (f) processBlob(f);
    };

    async function processBlob(blob) {
      $('shot').src = URL.createObjectURL(blob);
      $('shot').classList.remove('hidden');
      setStatus('Reading receipt...');
      $('scan').disabled = true;
      const fd = new FormData();
      fd.append('receipt', blob, 'receipt.jpg');
      try {
        const r = await fetch('/extract', { method: 'POST', body: fd });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Could not read the receipt');
        data = j;
        rows = j.items.map(i => ({ name: i.name, qty: i.qty, price: i.price, who: {} }));
        $('merchant').value = j.merchant || '';
        $('date').value = j.date || '';
        $('category').value = j.category || '';
        $('total').value = j.total;
        $('notes').textContent = j.confidence_notes ? 'Note: ' + j.confidence_notes : '';
        renderTable();
        $('review').classList.remove('hidden');
        setStatus('Scan complete. Review the items below, or scan again.');
      } catch (e) {
        setStatus('Error: ' + e.message, true);
      } finally {
        $('scan').disabled = false;
      }
    }

    /* ---------- items table ---------- */
    function renderTable() {
      const showWho = isItemwise(), ps = people();
      let h = '<tr><th>Item</th><th>Qty</th><th>Price</th>';
      if (showWho) h += ps.map(p => `<th class="c">${esc(p)}</th>`).join('');
      h += '<th></th></tr>';
      rows.forEach((r, i) => {
        h += `<tr><td><input data-i="${i}" data-f="name" value="${esc(r.name)}"></td>
      <td><input class="num" type="number" step="any" data-i="${i}" data-f="qty" value="${esc(r.qty)}"></td>
      <td><input class="num" type="number" step="any" data-i="${i}" data-f="price" value="${esc(r.price)}"></td>`;
        if (showWho) ps.forEach(p => {
          h += `<td class="c"><input type="checkbox" data-i="${i}" data-p="${esc(p)}" ${r.who[p] !== false ? 'checked' : ''}></td>`;
        });
        h += `<td><button class="x" data-del="${i}" title="Remove">&#10005;</button></td></tr>`;
      });
      $('items').innerHTML = h;
    }
    $('items').addEventListener('input', e => {
      const t = e.target, i = t.dataset.i;
      if (i === undefined) return;
      if (t.dataset.f) rows[i][t.dataset.f] = t.value;
      else if (t.dataset.p !== undefined) rows[i].who[t.dataset.p] = t.checked;
    });
    $('items').addEventListener('click', e => {
      const del = e.target.dataset.del;
      if (del !== undefined) { rows.splice(+del, 1); renderTable(); }
    });
    $('addRow').onclick = () => { rows.push({ name: '', qty: 1, price: 0, who: {} }); renderTable(); };

    /* ---------- calculate, then open the result page ---------- */
    function payload() {
      const ps = people();
      return {
        items: rows.map(r => ({ name: r.name, qty: r.qty, price: r.price, who: ps.filter(p => r.who[p] !== false) })),
        people: ps, payer: $('payer').value, total: $('total').value, tip_pct: $('tip').value,
        method: $('method').value, lang: 'English', upi: $('upi').value,
        merchant: $('merchant').value, date: $('date').value, category: $('category').value,
        currency: data.currency, taxes: data.taxes,
      };
    }

    $('calc').onclick = async () => {
      const split = isSplit();
      $('calc').disabled = true;
      try {
        const r = await fetch(split ? '/calculate' : '/expense', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload())
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Calculation failed');
        sessionStorage.setItem('receiptResult', JSON.stringify({
          split, itemwise: isItemwise(), receiptTotal: $('total').value, result: j
        }));
        location.href = 'result.html';
      } catch (e) {
        alert('Error: ' + e.message);
        $('calc').disabled = false;
      }
    };

    window.addEventListener('pagehide', stopCam);
    refreshPayer();
    refreshTaskUI();
  </script>
</body>

</html>
